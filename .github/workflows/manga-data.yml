name: Update manga data

# Downloads the 10,000 most popular manga plus the 500 newest additions from AniList's free API
# (about 10 minutes), rebuilds data/manga.json and data/manga-recs.json, and commits them.
# Runs once a day, and can be started by hand from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"   # every day, 04:23 UTC
  push:
    branches: [main]
    paths: ["tools/fetch_manga_anilist.py", "tools/build_manga.py", ".github/workflows/manga-data.yml"]

permissions:
  contents: write
  pages: write

concurrency:
  group: manga-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install --quiet numpy scipy scikit-learn
      - name: Download the top 10,000 + newest manga from AniList (about 10 minutes)
        timeout-minutes: 40
        run: python tools/fetch_manga_anilist.py "$RUNNER_TEMP/manga-raw.jsonl.gz" --top 10000 --newest 500 --budget-minutes 32
      - name: Build catalog and recommendations
        run: python tools/build_manga.py "$RUNNER_TEMP/manga-raw.jsonl.gz" data
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manga.json data/manga-recs.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update manga data from AniList"
          git push
      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
