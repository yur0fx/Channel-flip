name: Update manga data and recommendations

# Also refreshes the "If you like this" picks for anime and manga from AniList's community recommendations
# (what real viewers and readers voted for), filled out with the site's own similarity matches.
# Keeps the manga catalog up to date from AniList's free API: each run adds the newest titles, then
# grows the catalog down the popularity list toward 10,000 (or refreshes it once full), within about
# 40 minutes. data/cache/ holds the raw titles between runs; data/manga.json and data/manga-recs.json
# are what the site loads. Runs once a day, and can be started by hand from the Actions tab.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"   # every day, 04:23 UTC
  push:
    branches: [main]
    paths: ["tools/fetch_manga_anilist.py", "tools/build_manga.py", "tools/fetch_recs_anilist.py", "tools/merge_recs.py", ".github/workflows/manga-data.yml"]

permissions:
  contents: write
  pages: write

concurrency:
  group: manga-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install --quiet numpy scipy scikit-learn
      - name: Update the manga list from AniList (up to 20 minutes)
        timeout-minutes: 28
        run: |
          python tools/fetch_manga_anilist.py "$RUNNER_TEMP/manga-raw.jsonl.gz" \
            --cache data/cache/manga-anilist.jsonl.gz --top 10000 --newest 500 --budget-minutes 20 \
            --summary data/cache/last-run.txt
          mkdir -p data/cache && cp "$RUNNER_TEMP/manga-raw.jsonl.gz" data/cache/manga-anilist.jsonl.gz
      - name: Build catalog and recommendations
        run: python tools/build_manga.py "$RUNNER_TEMP/manga-raw.jsonl.gz" data
      - name: Download community recommendations from AniList (up to 30 minutes)
        timeout-minutes: 38
        continue-on-error: true
        run: |
          python tools/fetch_recs_anilist.py data/cache/anilist-recs.json.gz --anime 12000 --manga 11000 \
            --budget-minutes 30 --summary data/cache/last-recs-run.txt
      - name: Merge recommendations
        run: python tools/merge_recs.py data
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update manga data and recommendations from AniList"
          git pull --rebase origin main   # page edits may have landed during the run
          git push
      - name: Rebuild GitHub Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
